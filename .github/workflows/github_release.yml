name: Create a release
on:
  push:
    branches:
      - '!**'
      - 'main'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-22.04
    # Skip workflow re-entry on changelog automation commits.
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    env:
      TOKEN: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    outputs:
      version: ${{ steps.next_version.outputs.version }}
      has_release: ${{ steps.next_version.outputs.has_release }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Conventional commit check
        uses: cocogitto/cocogitto-action@9a9fe03b31c47444290c0d7f9b1ee1b44ee13f20 #v4.1.0
        with:
          command: check
          args: --from-latest-tag

      - name: Get Next Version
        id: next_version
        run: |
          set +e
          stderr_file=$(mktemp)
          cog_stdout=$(cog bump --auto --dry-run 2>"$stderr_file")
          bump_exit=$?
          cog_stderr=$(cat "$stderr_file")
          rm -f "$stderr_file"
          set -e

          if [ "$bump_exit" -eq 0 ]; then
            # cog's dry-run version string is the last line of stdout;
            # merging stderr in here (as `2>&1`) previously let cocogitto's
            # own info/log lines ride along into $GITHUB_OUTPUT, and any
            # embedded newline corrupts that file's key=value format for
            # every step after it ("Invalid format 'v0.3.0'").
            next_version=$(printf '%s\n' "$cog_stdout" | tail -n1 | tr -d '[:space:]')
            if ! printf '%s' "$next_version" | grep -Eq '^v?[0-9]+\.[0-9]+\.[0-9]+'; then
              echo "cog bump succeeded but its output didn't look like a version:"
              printf '%s\n' "$cog_stdout"
              exit 1
            fi
            echo "has_release=true" >> "$GITHUB_OUTPUT"
            echo "version=$next_version" >> "$GITHUB_OUTPUT"
          elif printf '%s\n%s\n' "$cog_stdout" "$cog_stderr" | grep -Eiq "nothing to bump|no commits|no conventional commit"; then
            echo "No releasable commits found."
            echo "has_release=false" >> "$GITHUB_OUTPUT"
            echo "version=" >> "$GITHUB_OUTPUT"
          else
            echo "Unexpected cocogitto failure:"
            printf '%s\n%s\n' "$cog_stdout" "$cog_stderr"
            exit "$bump_exit"
          fi

      - name: Create and push release tag
        if: steps.next_version.outputs.has_release == 'true'
        run: |
          version='${{ steps.next_version.outputs.version }}'
          if git ls-remote --tags origin | grep -q "refs/tags/$version$"; then
            echo "Tag $version already exists on origin; skipping push."
          else
            git tag "$version"
            if ! git push origin "$version"; then
              echo "Failed to push tag $version to origin."
              exit 1
            fi
          fi

      - name: Verify remote tag exists
        if: steps.next_version.outputs.has_release == 'true'
        run: |
          version='${{ steps.next_version.outputs.version }}'
          if ! git ls-remote --tags origin | grep -q "refs/tags/$version$"; then
            echo "Tag $version was not found on origin."
            exit 1
          fi

      # Scoped to just this release, for the GitHub release body only —
      # deliberately separate from CHANGELOG.md, which is pushed to main
      # directly below (see the App-token bypass step).
      - name: Generate release notes
        if: steps.next_version.outputs.has_release == 'true'
        run: cog changelog --at ${{ steps.next_version.outputs.version }} > release-notes.md

      - name: Regenerate CHANGELOG.md
        if: steps.next_version.outputs.has_release == 'true'
        run: cog changelog > CHANGELOG.md

      # GitHub Actions is not permitted to open PRs on this org, so PR-based
      # changelog updates aren't an option. We push straight to main instead.
      # The "update", "required_signatures" and "pull_request" rules on the
      # main-rules ruleset block a plain push outright — the only way past
      # them is a listed bypass_actor. This requires the release App's
      # installation to be added to main-rules as an "Integration" bypass
      # actor (an Admin *user* role bypass does NOT cover an App token).
      - name: Generate GitHub App token
        if: steps.next_version.outputs.has_release == 'true'
        id: app_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 #v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Commit and push CHANGELOG.md to main
        if: steps.next_version.outputs.has_release == 'true'
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          APP_SLUG: ${{ steps.app_token.outputs.app-slug }}
        run: |
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${APP_SLUG}[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          if git diff --cached --quiet; then
            echo "No changelog changes to commit."
          else
            git commit -m "docs(changelog): update for ${{ steps.next_version.outputs.version }} [skip ci]"
            git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

      - name: Check if GitHub release exists
        if: steps.next_version.outputs.has_release == 'true'
        id: existing_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version='${{ steps.next_version.outputs.version }}'
          if gh release view "$version" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload github release
        if: steps.next_version.outputs.has_release == 'true' && steps.existing_release.outputs.exists == 'false'
        uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8 #v2.3
        with:
          body_path: release-notes.md
          tag_name: ${{ steps.next_version.outputs.version }}

  docker:
    name: docker
    needs: release
    if: needs.release.outputs.has_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.version }}

      - name: Compute lowercase image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build image for scanning (single-arch, local)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ steps.image.outputs.name }}:scan

      - name: Trivy scan (blocks publish on CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.name }}:scan
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

      - name: Upload Trivy results to the Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ needs.release.outputs.version }}
            ${{ steps.image.outputs.name }}:latest
