name: Create a release
on:
  push:
    branches:
      - '!**'
      - 'main'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-22.04
    # Skip workflow re-entry on changelog automation commits.
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    env:
      TOKEN: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
      pull-requests: write
    outputs:
      version: ${{ steps.next_version.outputs.version }}
      has_release: ${{ steps.next_version.outputs.has_release }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Conventional commit check
        uses: cocogitto/cocogitto-action@9a9fe03b31c47444290c0d7f9b1ee1b44ee13f20 #v4.1.0
        with:
          command: check
          args: --from-latest-tag

      - name: Get Next Version
        id: next_version
        run: |
          set +e
          next_version=$(cog bump --auto --dry-run 2>&1)
          bump_exit=$?
          set -e

          if [ "$bump_exit" -eq 0 ]; then
            echo "has_release=true" >> "$GITHUB_OUTPUT"
            echo "version=$next_version" >> "$GITHUB_OUTPUT"
          elif echo "$next_version" | grep -Eiq "nothing to bump|no commits|no conventional commit"; then
            echo "No releasable commits found."
            echo "has_release=false" >> "$GITHUB_OUTPUT"
            echo "version=" >> "$GITHUB_OUTPUT"
          else
            echo "Unexpected cocogitto failure:"
            echo "$next_version"
            exit "$bump_exit"
          fi

      - name: Create and push release tag
        if: steps.next_version.outputs.has_release == 'true'
        run: |
          version='${{ steps.next_version.outputs.version }}'
          if git ls-remote --tags origin | grep -q "refs/tags/$version$"; then
            echo "Tag $version already exists on origin; skipping push."
          else
            git tag "$version"
            if ! git push origin "$version"; then
              echo "Failed to push tag $version to origin."
              exit 1
            fi
          fi

      - name: Verify remote tag exists
        if: steps.next_version.outputs.has_release == 'true'
        run: |
          version='${{ steps.next_version.outputs.version }}'
          if ! git ls-remote --tags origin | grep -q "refs/tags/$version$"; then
            echo "Tag $version was not found on origin."
            exit 1
          fi

      # Scoped to just this release, for the GitHub release body only —
      # deliberately separate from CHANGELOG.md, which is updated in a PR
      # below so protected branch rules are respected.
      - name: Generate release notes
        if: steps.next_version.outputs.has_release == 'true'
        run: cog changelog --at ${{ steps.next_version.outputs.version }} > release-notes.md

      - name: Regenerate CHANGELOG.md
        if: steps.next_version.outputs.has_release == 'true'
        run: cog changelog > CHANGELOG.md

      - name: Open PR with CHANGELOG.md update
        if: steps.next_version.outputs.has_release == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: docs(changelog): update for ${{ steps.next_version.outputs.version }} [skip ci]
          title: docs(changelog): update for ${{ steps.next_version.outputs.version }}
          body: |
            Automated changelog update for ${{ steps.next_version.outputs.version }}.

            This PR is opened by the release workflow to comply with branch protection
            rules that require changes to go through pull requests.
          branch: automation/changelog-${{ steps.next_version.outputs.version }}
          delete-branch: true
          add-paths: CHANGELOG.md

      - name: Check if GitHub release exists
        if: steps.next_version.outputs.has_release == 'true'
        id: existing_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version='${{ steps.next_version.outputs.version }}'
          if gh release view "$version" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload github release
        if: steps.next_version.outputs.has_release == 'true' && steps.existing_release.outputs.exists == 'false'
        uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8 #v2.3
        with:
          body_path: release-notes.md
          tag_name: ${{ steps.next_version.outputs.version }}

  docker:
    name: docker
    needs: release
    if: needs.release.outputs.has_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.version }}

      - name: Compute lowercase image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build image for scanning (single-arch, local)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ steps.image.outputs.name }}:scan

      - name: Trivy scan (blocks publish on CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.name }}:scan
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

      - name: Upload Trivy results to the Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ needs.release.outputs.version }}
            ${{ steps.image.outputs.name }}:latest
