name: CI

# Required gate for merging into main: this workflow runs on every pull
# request, plus on push to main itself. Configure branch protection on
# main to require the "test" and "lint" jobs below as required status
# checks, and to require a PR (no direct pushes) before contributors can
# merge.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Test (race detector, coverage)
        run: go test ./... -race -cover

      - name: Build public operator skill archive
        run: bash scripts/package-skills.sh ci dist/skills

      - name: Upload public operator skill archive
        uses: actions/upload-artifact@v4
        with:
          name: infrastructure-mcp-operator-skill
          path: dist/skills/infrastructure-mcp-operator-ci.zip
          if-no-files-found: error
          retention-days: 7

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        # v7+ is required for golangci-lint v2 config support (.golangci.yml
        # is `version: "2"`); v6 only understands the v1 schema and would
        # silently mis-lint or fail on this repo's config. Version pinned
        # (not "latest") so the required PR gate is reproducible.
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Reports only vulnerabilities in code paths this binary can reach,
      # including the Go standard library at the pinned go.mod version.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  image-scan:
    name: image-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Scans the real image (stdlib + base layers), the same gate the release
      # workflow applies, so a failing publish is caught on the PR instead.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          pull: true
          tags: infrastructure-mcp:scan

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: infrastructure-mcp:scan
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
