name: Release

# Runs on every push to main, i.e. every merged PR (CI has already gated
# the PR itself — see ci.yml). Three stages:
#   1. bump-version: cocogitto computes the next semver from Conventional
#      Commits since the last tag, updates CHANGELOG.md, commits, and
#      tags. If there's nothing release-worthy since the last tag, later
#      jobs are skipped entirely.
#   2. docker: builds the image, scans it with Trivy *before* publishing
#      (a CRITICAL/HIGH finding blocks the push), then builds+pushes the
#      multi-arch image to GHCR only once the scan is clean.
#   3. The Trivy SARIF is uploaded to the repo's Security tab regardless
#      of pass/fail, so findings are visible even when they block a
#      release.

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bump-version:
    name: bump-version
    runs-on: ubuntu-latest
    # cog's own version-bump commit is tagged with the [skip ci] marker
    # configured in cog.toml, so the workflow run it triggers doesn't try
    # to bump again on top of itself.
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    permissions:
      contents: write
    outputs:
      released: ${{ steps.bump.outputs.released }}
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # cocogitto/cocogitto-action installs cog and runs `cog bump --auto`
      # (commits CHANGELOG.md + creates the tag locally); it does not push.
      # It exits non-zero when there's nothing releasable since the last
      # tag (e.g. a docs/chore-only merge), so this step is allowed to
      # fail and the next step turns that into a clean "released=false".
      - name: Bump version and generate changelog
        id: cog
        continue-on-error: true
        uses: cocogitto/cocogitto-action@v3
        with:
          command: bump
          args: --auto
          git-user: github-actions[bot]
          git-user-email: github-actions[bot]@users.noreply.github.com

      - name: Resolve release outputs
        id: bump
        run: |
          set -euo pipefail
          if [ "${{ steps.cog.outcome }}" != "success" ]; then
            echo "No releasable Conventional Commits since the last tag; skipping release."
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tag="${{ steps.cog.outputs.version }}"
          echo "released=true" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      # cog creates a lightweight tag (points straight at the commit, no
      # tag object) — `git push --follow-tags` only pushes *annotated*
      # tags, so it would silently push the commit and drop the tag.
      # Push both refs explicitly instead. This also pushes a commit
      # directly to `main` with the default GITHUB_TOKEN: if branch
      # protection requires PRs, add github-actions[bot] to that rule's
      # bypass list, or this push (and the release) will fail closed.
      - name: Push commit and tag
        if: steps.bump.outputs.released == 'true'
        run: |
          set -euo pipefail
          git push origin HEAD:main
          git push origin "${{ steps.bump.outputs.tag }}"

  docker:
    name: docker
    needs: bump-version
    if: needs.bump-version.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump-version.outputs.tag }}

      # GHCR rejects uppercase image names; github.repository preserves
      # the repo's actual casing, so lowercase it explicitly rather than
      # only working by accident for all-lowercase repo names/owners.
      - name: Compute lowercase image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build image for scanning (single-arch, local)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ steps.image.outputs.name }}:scan

      - name: Trivy scan (blocks publish on CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.image.outputs.name }}:scan
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

      - name: Upload Trivy results to the Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ needs.bump-version.outputs.version }}
            ${{ steps.image.outputs.name }}:latest
