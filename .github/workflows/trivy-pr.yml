name: Trivy PR Scan

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  trivy-scan:
    name: Trivy security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Run Trivy filesystem scan
        id: trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: json
          output: trivy-results.json
          severity: CRITICAL,HIGH
          exit-code: "0"

      - name: Run Trivy filesystem scan (exit check)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
        continue-on-error: true
        id: trivy-exit

      - name: Parse results and comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const raw = fs.readFileSync('trivy-results.json', 'utf8');
            const results = JSON.parse(raw);

            const severities = { CRITICAL: 0, HIGH: 0 };
            const findings = [];

            for (const result of (results.Results || [])) {
              for (const vuln of (result.Vulnerabilities || [])) {
                if (vuln.Severity === 'CRITICAL' || vuln.Severity === 'HIGH') {
                  severities[vuln.Severity]++;
                  findings.push({
                    id: vuln.VulnerabilityID,
                    pkg: vuln.PkgName,
                    installed: vuln.InstalledVersion,
                    fixed: vuln.FixedVersion || 'n/a',
                    severity: vuln.Severity,
                    title: vuln.Title,
                  });
                }
              }
            }

            const total = severities.CRITICAL + severities.HIGH;
            const icon = severities.CRITICAL > 0 ? ':rotating_light:' : ':warning:';

            let body;
            if (total === 0) {
              body = ':white_check_mark: **Trivy scan passed** — no CRITICAL or HIGH vulnerabilities found.';
            } else {
              const rows = findings
                .sort((a, b) => (a.severity === 'CRITICAL' ? -1 : 1))
                .map(f => {
                  const fix = f.fixed !== 'n/a' ? `\`${f.fixed}\`` : '_no fix_';
                  return `| ${f.severity} | \`${f.id}\` | \`${f.pkg}\` | \`${f.installed}\` | ${fix} | [${f.title}](https://nvd.nist.gov/vuln/detail/${f.id}) |`;
                })
                .join('\n');

              body = [
                `${icon} **Trivy found ${total} vulnerabilit${total === 1 ? 'y' : 'ies'}**`,
                '',
                `| Severity | ID | Package | Installed | Fixed | Description |`,
                `|----------|----|---------|-----------|-------|-------------|`,
                rows,
                '',
                `> ` + `${severities.CRITICAL} CRITICAL, ${severities.HIGH} HIGH`.trim(),
                `> Build: [${context.runId}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              ].join('\n');
            }

            // Find and update existing comment, or create new one
            const marker = '<!-- trivy-scan -->';
            const taggedBody = marker + '\n' + body;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: taggedBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: taggedBody,
              });
            }

            if (severities.CRITICAL > 0) {
              core.setFailed(`${severities.CRITICAL} CRITICAL vulnerabilities found`);
            }
