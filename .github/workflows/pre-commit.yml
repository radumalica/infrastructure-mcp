name: Pre-commit

on:
  pull_request:
    types: [opened, synchronize, reopened]

env:
  SKIP: check-git-config-email

jobs:
  pre-commit:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Shallow clones should be disabled so we can bump on previous tags
          fetch-tags: true # This should negate the need for fetch-depth 0 but it seems both are required

      - name: Conventional commit check
        uses: cocogitto/cocogitto-action@9a9fe03b31c47444290c0d7f9b1ee1b44ee13f20 #v4.1.0
        with:
          command: check
          args: --from-latest-tag

      - uses: actions/setup-python@v6
      - id: changed-files
        uses: tj-actions/changed-files@e0021407031f5be11a464abee9a0776171c79891 # v46

      - name: Install terraform-docs
        run: |
          mkdir ~/tempbin
          cd ~/tempbin
          LATEST_TERRAFORM_DOCS=$(gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            /repos/terraform-docs/terraform-docs/releases/latest \
            --jq '.assets[] | select(.name | contains ("linux-amd64")) | .browser_download_url')
          wget $LATEST_TERRAFORM_DOCS
          tar -xzf $(basename $LATEST_TERRAFORM_DOCS)
          chmod +x terraform-docs
          echo "~/tempbin" >> $GITHUB_PATH
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: pre-commit/action@v3.0.1
        with:
          # This will run all pre-commit hooks on all changed files
          extra_args: --files ${{ steps.changed-files.outputs.all_changed_files }}
