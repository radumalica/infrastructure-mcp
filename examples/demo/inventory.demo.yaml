# Inventory for the try-it demo. Both targets are throwaway containers started
# by docker-compose.yml; the key is generated by run-demo.sh and never committed.
servers:
  demo-web:
    hostname: target-web
    user: hermes
    key: /keys/id_ed25519
    tags:
      - linux
      - web

  demo-db:
    hostname: target-db
    user: hermes
    key: /keys/id_ed25519
    tags:
      - linux
      - database
