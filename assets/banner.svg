<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="420" viewBox="0 0 1600 420">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07111f"/>
      <stop offset="100%" stop-color="#0d1b2a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1600" height="420" fill="url(#bg)"/>

  <circle cx="145" cy="210" r="72" fill="none" stroke="url(#accent)" stroke-width="8"/>
  <ellipse cx="145" cy="280" rx="36" ry="10" fill="url(#accent)"/>
  <rect x="109" y="280" width="72" height="42" rx="4" fill="url(#accent)"/>
  <ellipse cx="145" cy="322" rx="36" ry="10" fill="url(#accent)"/>
  <line x1="145" y1="145" x2="145" y2="260" stroke="#78dce8" stroke-width="3"/>
  <line x1="110" y1="175" x2="180" y2="175" stroke="#78dce8" stroke-width="3"/>
  <circle cx="145" cy="145" r="7" fill="#78dce8"/>
  <circle cx="110" cy="175" r="7" fill="#78dce8"/>
  <circle cx="180" cy="175" r="7" fill="#78dce8"/>
  <circle cx="125" cy="205" r="7" fill="#78dce8"/>
  <circle cx="165" cy="205" r="7" fill="#78dce8"/>

  <text x="260" y="145" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="62" font-weight="700" fill="white">
