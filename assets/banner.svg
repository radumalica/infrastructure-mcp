      <line x1="232" y1="150" x2="300" y2="134"/>
      <line x1="210" y1="202" x2="260" y2="260"/>
      <line x1="130" y1="202" x2="85" y2="260"/>
      <line x1="108" y1="150" x2="50" y2="134"/>
      <line x1="140" y1="100" x2="90" y2="52"/>
