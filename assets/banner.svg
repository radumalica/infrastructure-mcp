  </text>

  <g transform="translate(1110,60)">
    <circle cx="170" cy="150" r="62" fill="none" stroke="url(#accent)" stroke-width="5" filter="url(#glow)"/>
    <text x="138" y="160" font-family="Inter,Arial" font-size="34" fill="white" font-weight="700">MCP</text>

    <g fill="#0f172a" stroke="#38bdf8" stroke-width="2">
      <rect x="130" y="0" width="80" height="48" rx="10"/>
      <rect x="300" y="110" width="90" height="48" rx="10"/>
      <rect x="230" y="260" width="90" height="48" rx="10"/>
      <rect x="10" y="260" width="90" height="48" rx="10"/>
      <rect x="-40" y="110" width="90" height="48" rx="10"/>
      <rect x="40" y="20" width="70" height="44" rx="10"/>
    </g>

    <g font-family="Inter,Arial" font-size="16" fill="#7dd3fc" text-anchor="middle">
