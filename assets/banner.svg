  <g transform="translate(260,340)" font-family="Inter,Arial" font-size="18">
    <rect x="0" y="-24" width="210" height="42" rx="21" fill="#0f172a" stroke="#22d3ee"/>
    <text x="105" y="3" text-anchor="middle" fill="#7dd3fc">SAFE BY DESIGN</text>

    <rect x="235" y="-24" width="220" height="42" rx="21" fill="#0f172a" stroke="#4f46e5"/>
