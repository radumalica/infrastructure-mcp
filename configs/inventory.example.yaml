# Example inventory file. Copy to inventory.yaml (or point --inventory at a
# copy elsewhere) and fill in real values. Secrets are referenced via
# environment variable placeholders and resolved at load time — never
# commit real credentials to this file.

servers:
  archive:
    hostname: 10.0.0.5
    user: hermes
    key: ~/.ssh/archive
    tags:
      - linux
      - ethereum

  pve01:
    hostname: 10.0.0.2
    user: hermes
    proxyjump: jumpbox
    tags:
      - proxmox

routers:
  core:
    hostname: 10.0.0.10
    vendor: cisco
    user: admin
    password: ${CORE_ROUTER_PASSWORD}

  # Old gear with no SSH server at all: reachable only via Telnet.
  # Telnet devices are always user/password auth (no public keys).
  legacy-edge:
    hostname: 10.0.0.12
    vendor: cisco
    user: admin
    password: ${LEGACY_EDGE_PASSWORD}
    protocol: telnet

switches:
  sw01:
    hostname: 10.0.0.20
    vendor: cisco
    user: admin
    password: ${SW01_PASSWORD}

  # Old SSH stack that only speaks obsolete key exchange/cipher/MAC
  # algorithms. legacy_crypto opts this one device into
  # golang.org/x/crypto/ssh's InsecureAlgorithms() so the handshake can
  # still succeed; every other target keeps the modern, secure defaults.
  ancient-sw:
    hostname: 10.0.0.21
    vendor: cisco
    user: admin
    password: ${ANCIENT_SW_PASSWORD}
    legacy_crypto: true

# Each entry is keyed by name, so multiple instances of the same service
# (per-environment Grafanas, multiple Proxmox clusters, ...) live side by
# side under one key instead of the schema only ever allowing one.
grafana:
  main:
    url: https://grafana.lab.local
    token: ${GRAFANA_TOKEN}

proxmox:
  lab:
    url: https://pve.lab.local:8006
    token: ${PROXMOX_TOKEN}
